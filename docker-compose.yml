services:
  database:
    image: postgres:latest
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
     - postgres_data:/var/lib/postgresql
     - ./database/init:/docker-entrypoint-initdb.d
  
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
    volumes:
      - ./web:/app/web
      - ./utils:/app/utils
      - ./integrations:/app/integrations
    environment:
      JWT_SECRET: ${JWT_SECRET}
    command:
      [
      "uvicorn",
      "web.main:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8000",
      "--reload"
    ]

  worker:
    profiles:
      - worker
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    depends_on:
      - database
    command: ["python","-m","worker.api_worker"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - web
    volumes:
      - ./frontend:/app
      - /app/node_modules


volumes:
  postgres_data:
