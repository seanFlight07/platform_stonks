services:
  database:
    image: postgres:latest
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
     - postgres_data:/var/lib/postgresql
     - ./database/init:/docker-entrypoint-initdb.d
  
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database

  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    depends_on:
      - database
    command: ["python","-m","worker.api_worker"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - web
volumes:
  postgres_data:
